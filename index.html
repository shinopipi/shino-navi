async function searchRoutes(from, to){
  const key = ttKey();
  if(key){
    try{ return await routesTomTom(from, to, key); }
    catch(e){ toast('渋滞情報つきの検索に失敗しました（'+e.message+'）。渋滞を考慮せずに探します', 4500); }
  }
  try{ return await routesValhalla(from, to); }
  catch(e){ const R = await routeOSRM(from, to); R.via=viaNames(R); return [R]; }
}
// おすすめ＝「重い渋滞（中以上）がないルートの中で最速」。どれも渋滞していれば単純に最速
function pickRecommended(list){
  const t = r=>r.duration;
  const heavy = r=>(r.traffic||[]).some(x=>x.mag>=2 || x.cat==='ROAD_CLOSURE');
  const fastest = list.reduce((b,r,i)=>t(r)<t(list[b])?i:b, 0);
  const clean = list.map((r,i)=>i).filter(i=>!heavy(list[i]));
  const bestClean = clean.length ? clean.reduce((b,i)=>t(list[i])<t(list[b])?i:b, clean[0]) : fastest;
  // 渋滞なしルートが最速より10分以上遅いなら、最速を優先
  recIdx = t(list[bestClean]) - t(list[fastest]) <= 600 ? bestClean : fastest;
  list.forEach((r,i)=>{ r.labels=[]; if(i===recIdx) r.labels.push('おすすめ'); if(i===fastest) r.labels.push('最速'); r.tollInfo = estimateToll(r); if(r.tollInfo) r.labels.push(tollText(r.tollInfo)); else if(r.toll) r.labels.push('有料'); });
  return recIdx;
}
async function calcRoute(from, to){
  routeList = await searchRoutes(from, to);
  pickRecommended(routeList);
  selIdx = recIdx;
  routeList[selIdx] = await alignRoute(routeList[selIdx]);
  RT = routeList[selIdx];
  afterRouteSet();
}
function afterRouteSet(){
  spoken = new Set(); RT.lastIdx = 0;
  drawRoute(); drawAlts(); drawTraffic();
  checkRouteRules(); computeRouteSignals(); loadRouteSignals();
  if(!navigating){ const on = incidentsOnRoute(RT); if(on.length) toast(`⚠️ このルート上に ${[...new Set(on.map(i=>i.n))].join('・')} があります（${on.length}件）`, 4500); }
}
async function selectRoute(i){
  if(!routeList[i]) return;
  selIdx = i; RT = routeList[i]; afterRouteSet(); renderRouteCards();
  if(!routeList[i].aligned){
    const a = await alignRoute(routeList[i]);
    if(selIdx===i && !navigating){ routeList[i] = a; RT = a; afterRouteSet(); }
  }
}

/* ================= ルートを地図の道路に重ね直す（マップマッチング） =================
   TomTom のルート（渋滞を考えて選んだ道順）を、Valhalla の trace_route で
   OpenStreetMap の道路の上に載せ直す。線・自車・案内地点が地図の道路と一致する */
function enc6(pts){ let out='', pl=0, pg=0;
  const e=v=>{ v = v<0 ? ~(v<<1) : (v<<1); let s=''; while(v>=0x20){ s+=String.fromCharCode((0x20|(v&0x1f))+63); v>>=5; } return s+String.fromCharCode(v+63); };
  pts.forEach(p=>{ const la=Math.round(p.lat*1e6), lo=Math.round(p.lng*1e6); out+=e(la-pl)+e(lo-pg); pl=la; pg=lo; });
  return out; }
function nearestIdx(R, p, from=0){ let bi=from, bd=Infinity; for(let i=from;i<R.coords.length;i++){ const d=dist(R.coords[i],p); if(d<bd){bd=d;bi=i;} } return bi; }
async function alignRoute(R){
  if(R.src==='orbis') return R;   // 地図と同じデータなので重ね直さない
  if(!R || R.aligned || R.engine!=='tomtom' || R.distance>250000) return R;
  // 30mおき程度に間引いて送る
  const pts=[]; let last=null;
  R.coords.forEach((c,i)=>{ if(!last || dist(last,c)>30 || i===R.coords.length-1){ pts.push(c); last=c; } });
  const req = {encoded_polyline:enc6(pts), shape_match:'map_snap', costing:'auto',
    trace_options:{search_radius:35, gps_accuracy:8}, directions_options:{units:'kilometers', language:'ja-JP'}};
  try{
    const body = JSON.stringify(req); let j = null;
    try{   // ふつうは POST、だめなら（短いルートは）GET で
      const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 12000);
      const r = await fetch('https://valhalla1.openstreetmap.de/trace_route', {method:'POST', body, signal:ctl.signal, headers:{'Content-Type':'text/plain'}});
      clearTimeout(tm); j = await r.json();
    }catch(e){
      if(body.length < 7000){ const r = await fetch('https://valhalla1.openstreetmap.de/trace_route?json='+encodeURIComponent(body)); j = await r.json(); }
    }
    if(!j || !j.trip || !j.trip.legs) throw new Error((j&&j.error)||'trace');
    let coords=[]; j.trip.legs.forEach(l=>{ const c=decode6(l.shape); if(coords.length && dist(coords[coords.length-1],c[0])<1) c.shift(); coords=coords.concat(c); });
    if(coords.length<2) throw 0;
    // 重ね直した線が元の長さから大きく外れていたら使わない
    let len=0; for(let i=1;i<coords.length;i++) len+=dist(coords[i-1],coords[i]);
    if(Math.abs(len-R.distance) > Math.max(800, R.distance*.15)) throw new Error('length');
    // 案内（曲がる場所）は新しい線の上で位置を取り直す。車線などはそのまま
    const steps = R.steps.map(s=>{ const t={...s}; delete t._idx; delete t._at; return t; });
    const N = buildRT(coords, steps, R.duration, 'tomtom');
    ['delay','noTraffic','toll','via','labels','tollInfo','time'].forEach(k=>{ if(R[k]!==undefined) N[k]=R[k]; });
    const map0 = i=>{ const p=R.coords[Math.min(i,R.coords.length-1)]; return nearestIdx(N,p); };
    N.traffic = (R.traffic||[]).map(t=>({...t, i0:map0(t.i0), i1:map0(t.i1)})).filter(t=>t.i1>t.i0);
    N._tollSecs = (R._tollSecs||[]).map(s=>[map0(s[0]), map0(s[1])]);
    N.aligned = true;
    return N;
  }catch(e){ R.aligned = true; R._aligned = false; console.warn('align failed', e); toast('ルートを地図の道路に重ねられませんでした（'+((e&&e.message)||'通信')+'）。少しずれて見える場合があります', 4000); return R; }   // 失敗したら元の線のまま
}

/* Orbis のルート線から、曲がる場所の案内（右折・左折・道の名前・有料区間）を作る */
async function addGuidance(R){
  const pts=[]; let last=null;
  R.coords.forEach((c,i)=>{ if(!last || dist(last,c)>30 || i===R.coords.length-1){ pts.push(c); last=c; } });
  const req = {encoded_polyline:enc6(pts), shape_match:'map_snap', costing:'auto',
    trace_options:{search_radius:40, gps_accuracy:10}, directions_options:{units:'kilometers', language:'ja-JP'}};
  const body = JSON.stringify(req); let j = null;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 15000);
    const r = await fetch('https://valhalla1.openstreetmap.de/trace_route', {method:'POST', body, signal:ctl.signal, headers:{'Content-Type':'text/plain'}});
    clearTimeout(tm); j = await r.json();
  }catch(e){
    try{ if(body.length<7000){ const r = await fetch('https://valhalla1.openstreetmap.de/trace_route?json='+encodeURIComponent(body)); j = await r.json(); } }catch(e2){}
  }
  if(!j || !j.trip || !j.trip.legs){ R.noGuide = true; return; }
  const steps=[]; const nL=j.trip.legs.length;
  j.trip.legs.forEach((leg,li)=>{
    const shp = decode6(leg.shape);
    leg.maneuvers.forEach(m=>{
      const t = VT[m.type] || ['continue','straight'];
      if(t[0]==='depart' && (li>0 || steps.length)) return;          // 途中の区切りは飛ばす
      if(t[0]==='arrive' && li<nL-1) return;
      const c = shp[Math.min(m.begin_shape_index, shp.length-1)];
      const dst = m.sign ? [...(m.sign.exit_toward_elements||[]), ...(m.sign.exit_branch_elements||[])].map(e=>e.text).join(', ') : '';
      steps.push({maneuver:{type:t[0], modifier:t[1], location:[c.lng,c.lat], exit:m.roundabout_exit_count},
        name:(m.street_names||[])[0]||'', ref:'', destinations:dst, intersections: m.toll ? [{classes:['toll']}] : []});
    });
  });
  if(steps.length<2) { R.noGuide = true; return; }
  const N = buildRT(R.coords, steps, R.duration, 'tomtom');
  R.steps = N.steps; R.via = viaNames(R);
}

/* 地図全体の渋滞（TomTom 交通流タイル）：起動直後から表示し、1分ごとに最新に更新
   使えるアドレスを順に試す（Orbis v2 → Orbis v1 → 従来版） */
let flowTpl = null;
function styleFlowLayers(){ return map.getStyle().layers.filter(l=>/flow/i.test(l.id) || /flow/i.test(String(l.source||''))).map(l=>l.id).filter(id=>id!=='ttflow'); }
async function setupFlow(){
  const key = ttKey(); if(!key) return;
  if(mapSrc==='tomtom' && styleFlowLayers().length){
    styleFlowLayers().forEach(id=>{ try{ map.setLayoutProperty(id,'visibility', ttFlowOn()?'visible':'none'); }catch(e){} });
    return;
  }
  const k = encodeURIComponent(key);
  const cands = [
    `https://api.tomtom.com/maps/orbis/traffic/flow/raster/tile/{z}/{x}/{y}?apiVersion=2&key=${k}&style=light&tileSize=256`,
    `https://api.tomtom.com/maps/orbis/traffic/tile/flow/{z}/{x}/{y}.png?apiVersion=1&key=${k}&style=light&tileSize=256`,
    `https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${k}&tileSize=256`];
  for(const t of cands){                      // 東京付近のタイルで試す
    try{ const r = await fetch(t.replace('{z}','10').replace('{x}','909').replace('{y}','403'));
      if(r.ok && (r.headers.get('content-type')||'').includes('image')){ flowTpl = t; break; } }catch(e){}
  }
  if(!flowTpl){ toast('渋滞の地図表示に使えるアドレスが見つかりませんでした（キーの Traffic API を確認）', 4500); return; }
  map.addSource('ttflow', {type:'raster', tileSize:256, maxzoom:18, tiles:[flowTpl+'&t='+Date.now()], attribution:'渋滞情報 © TomTom'});
  map.addLayer({id:'ttflow', type:'raster', source:'ttflow', minzoom:9, maxzoom:15, paint:{'raster-opacity':['interpolate',['linear'],['zoom'],9,.85,14,.75,15,0], 'raster-fade-duration':0},
    layout:{visibility: ttFlowOn()?'visible':'none'}}, 'alt-casing');
  setInterval(()=>{                            // 1分ごとに最新の渋滞へ
    if(document.visibilityState!=='visible' || !map.getSource('ttflow') || !ttFlowOn()) return;
    try{ map.getSource('ttflow').setTiles([flowTpl+'&t='+Date.now()]); }catch(e){}
  }, 60000);
}

/* ================= 案内文と矢印 ================= */
const DIR = {'left':'左','right':'右','slight left':'斜め左','slight right':'斜め右','sharp left':'左に大きく','sharp right':'右に大きく','straight':'直進','uturn':'Uターン'};
const ANG = {'straight':0,'slight right':45,'right':90,'sharp right':135,'uturn':180,'slight left':-45,'left':-90,'sharp left':-135};
function instr(s){
  const t=s.maneuver.type, m=s.maneuver.modifier||'straight', d=DIR[m]||'';
  const side = m.includes('left')?'左側の':m.includes('right')?'右側の':'';
  switch(t){
    case 'arrive': return '目的地です';
    case 'depart': return '出発します';
    case 'turn': case 'end of road':
      if(m==='left') return (t==='end of road'?'突き当たりを':'')+'左折です';
      if(m==='right') return (t==='end of road'?'突き当たりを':'')+'右折です';
      if(m==='uturn') return 'Uターンです';
      if(m==='straight') return '直進です';
      return d+'方向です';
    case 'merge': return '合流します';
    case 'on ramp': return side+'入口に入ります';
    case 'off ramp': return side+'出口に進みます';
    case 'fork': return '分岐を'+(m.includes('left')?'左':m.includes('right')?'右':'直進')+'方向です';
    case 'roundabout': case 'rotary': return 'ロータリーを'+(s.maneuver.exit||'')+'番目の出口です';
    case 'new name': case 'continue': case 'notification':
      return m==='straight' ? '道なりに進みます' : d+'方向です';
    default: return d ? d+'方向です' : '道なりに進みます';
  }
}
function arrowSvg(s){
  if(s.maneuver.type==='arrive') return '<svg viewBox="0 0 60 60"><path d="M16 56V6" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M18 6h30l-8 10 8 10H18z" fill="#fff"/></svg>';
  const m = s.maneuver.modifier||'straight';
  if(m==='uturn') return '<svg viewBox="0 0 60 60"><path d="M40 56V24a11 11 0 0 0-22 0v10" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M7 32l11 15 11-15z" fill="#fff"/></svg>';
  const a = ANG[m]||0;
  // 曲がる矢印（根元は下からまっすぐ、先が曲がる）
  if(a===0) return '<svg viewBox="0 0 60 60"><path d="M30 4 L50 28 H37 V57 H23 V28 H10 Z" fill="#fff"/></svg>';
  const rad=a*Math.PI/180, cx=30, cy=30, L=17;
  const ex=cx+Math.sin(rad)*L, ey=cy-Math.cos(rad)*L;
  return `<svg viewBox="0 0 60 60"><path d="M30 57 V${cy} L${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round"/>`
    + `<g transform="translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${a})"><path d="M0 -14 L15 4 H-15 Z" fill="#fff"/></g></svg>`;
}
function lanesHtml(s){
  const it = s.intersections && s.intersections[0];
  if(!it || !it.lanes || it.lanes.length<2 || !it.lanes.some(l=>!l.valid)) return '';
  return it.lanes.map(l=>{
    const ind = l.indications.find(x=>x!=='none') || 'straight';
    const a = ANG[ind] ?? 0;
    return `<div class="lane ${l.valid?'on':''}"><svg viewBox="0 0 24 24" style="transform:rotate(${a}deg)"><path d="M12 2l7 8h-5v12h-4V10H5z"/></svg></div>`;
  }).join('');
}

/* ================= ルート上の位置 ================= */
function projectOnRoute(p){
  const C=RT.coords, n=C.length;
  const kx=Math.cos(p.lat*Math.PI/180)*111320, ky=110540;
  const scan=(a,b)=>{ let best={d:1e9,i:0,t:0};
    for(let i=a;i<b;i++){
      const ax=(C[i].lng-p.lng)*kx, ay=(C[i].lat-p.lat)*ky, bx=(C[i+1].lng-p.lng)*kx, by=(C[i+1].lat-p.lat)*ky;
      const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
      let t = L2 ? -(ax*dx+ay*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(ax+t*dx, ay+t*dy);
      if(d<best.d) best={d,i,t};
    } return best; };
  let b = scan(Math.max(0,RT.lastIdx-3), Math.min(n-1,RT.lastIdx+400));
  if(b.d>60){ const f=scan(0,n-1); if(f.d<b.d) b=f; }
  RT.lastIdx = b.i;
  b.along = RT.cum[b.i] + b.t*(RT.cum[b.i+1]-RT.cum[b.i]);
  b.pt = {lng:C[b.i].lng+(C[b.i+1].lng-C[b.i].lng)*b.t, lat:C[b.i].lat+(C[b.i+1].lat-C[b.i].lat)*b.t};
  return b;
}
function pointAt(a){
  const C=RT.coords, cum=RT.cum; let i=Math.max(0,(pointAt.i||0)-1);
  if(cum[i]>a) i=0;
  while(i<cum.length-2 && cum[i+1]<a) i++;
  pointAt.i=i;
  const seg=cum[i+1]-cum[i]||1, t=Math.min(1,Math.max(0,(a-cum[i])/seg));
  return {p:{lat:C[i].lat+(C[i+1].lat-C[i].lat)*t, lng:C[i].lng+(C[i+1].lng-C[i].lng)*t}, h:bearing(C[i],C[i+1])};
}

/* ================= 案内 ================= */
function updateNav(){
  if(!RT || rerouting){ camera(); return; }
  const pr = projectOnRoute(pos);
  // ルートの近くなら、自車を道路の上に乗せて向きも道路に合わせる
  onRoute = pr.d < Math.max(30, Math.min(accuracy,50));
  if(onRoute){
    shown = pr.pt;
    const C = RT.coords, rb = bearing(C[pr.i], C[pr.i+1]);
    turnTo(rb, speed<3 ? 1 : .5);
  }

  // ルートから外れたら再検索
  if(!sim && pr.d > Math.max(50, accuracy*1.5)){
    offCount++;
    if(offCount>=3 && Date.now()-lastReroute>10000){ reroute(); return; }
  } else offCount = 0;

  const remain = RT.distance - pr.along; RT._curAlong = pr.along;
  if(remain < 25){ arrive(); return; }

  // 走った部分はグレー、残りは青
  const C = RT.coords;
  drawRoute(C.slice(0,pr.i+1).map(c=>[c.lng,c.lat]).concat([[pr.pt.lng,pr.pt.lat]]),
            [[pr.pt.lng,pr.pt.lat]].concat(C.slice(pr.i+1).map(c=>[c.lng,c.lat])));

  let k = RT.steps.findIndex((s,i)=>i>0 && s._at > pr.along+3);
  if(k<0) k = RT.steps.length-1;
  const s = RT.steps[k], dnext = Math.max(0, s._at - pr.along);
  // 信号：次の信号までの距離と「○つ目の信号を右折」
  let sigText = '';
  const ahead = (RT.sig||[]).filter(a=>a > pr.along+10);
  if(ahead.length && ahead[0]-pr.along < 2000){ $('#sigChip').textContent = '🚦 次の信号 '+fmtDist(ahead[0]-pr.along); $('#sigChip').classList.remove('hide'); }
  else $('#sigChip').classList.add('hide');
  const sm = s.maneuver.modifier||'';
  if(s.maneuver.type==='turn' && /left|right/.test(sm)){
    const upto = ahead.filter(a=>a <= s._at+30);
    if(upto.length && Math.abs(upto[upto.length-1]-s._at) <= 30){
      const n = upto.length; sigText = n===1 ? '信号を' : n<=3 ? n+'つ目の信号を' : '';
    }
  }
  const prevLen = s._at - (RT.steps[k-1] ? RT.steps[k-1]._at : 0);

  $('#bArrow').innerHTML = arrowSvg(s);
  const dp = distParts(dnext);
  $('#bDist').innerHTML = dp[0]+'<small>'+dp[1]+'</small>';
  $('#bText').textContent = sigText + instr(s);
  const road = [s.name, s.ref].filter(Boolean).join(' ');
  const dst = cleanDest(s), jname = dnext<1500 ? junctionName(s) : '';
  $('#bRoad').textContent = s.maneuver.type==='arrive' ? dest.name : [jname, dst ? dst+' 方面' : (!jname && road ? road+' 方面' : '')].filter(Boolean).join('　');
  // 残りメーター（300m以内で減っていく）
  const barMax = Math.min(300, Math.max(prevLen,1));
  $('#bar').classList.toggle('hide', dnext>300);
  $('#barFill').style.width = Math.max(0,Math.min(100, dnext/barMax*100))+'%';

  // 車線
  const laneArr = s.intersections && s.intersections[0] && s.intersections[0].lanes;
  const atSig = (RT.sig||[]).some(a=>Math.abs(a-s._at)<=30);
  updateJV(s, dnext, laneArr && laneArr.length>1 ? laneArr : null, atSig);
  const ln = (dnext<800 && !jvShown) ? lanesHtml(s) : '';
  $('#lanes').innerHTML = ln; $('#lanes').classList.toggle('hide', !ln);

  // その先
  const s2 = RT.steps[k+1];
  if(s2 && s2._at - s._at < 250 && dnext < 400){
    $('#then').innerHTML = arrowSvg(s2)+'その先 '+instr(s2); $('#then').classList.remove('hide');
  } else $('#then').classList.add('hide');

  // 今走っている道
  const cur = RT.steps[k-1] || RT.steps[0];
  const curName = [cur.name, cur.ref].filter(Boolean).join(' ');
  $('#roadNow').textContent = curName; $('#roadNow').classList.toggle('hide', !curName);

  // 音声
  const text = sigText + instr(s);
  if(dnext<=1200 && dnext>800 && speed>16 && !spoken.has(k+'a')){ spoken.add(k+'a'); speak(voiceDist(dnext)+'先、'+text); }
  else if(dnext<=550 && dnext>200 && !spoken.has(k+'b')){ spoken.add(k+'b'); speak('およそ'+voiceDist(dnext)+'先、'+text); }
  else if(dnext<=Math.max(60, speed*6) && !spoken.has(k+'c')){ spoken.add(k+'c'); spoken.add(k+'b');
    speak(s.maneuver.type==='arrive' ? 'まもなく目的地です' : 'まもなく、'+text+(s2 && s2._at-s._at<150 ? '。その先、'+instr(s2) : '')); }

  // 残り
  const rs = RT.duration * (remain/RT.distance);
  $('#nRemain').textContent = fmtDist(remain);
  $('#nTime').textContent = fmtDur(rs);
  $('#nEta').textContent = fmtClock(Date.now()+rs*1000);
  checkBetterRoute();
  checkIncidentsAhead(pr.along);

  renderHw(pr.along);
  camera(dnext);
  checkHighway();
}

async function reroute(){
  rerouting = true; lastReroute = Date.now(); offCount = 0;
  speak('ルートを再検索します');
  $('#bText').textContent = 'ルート再検索中…';
  try{ await calcRoute(pos, dest); }
  catch(e){ toast('再検索に失敗しました'); }
  rerouting = false;
  updateNav();
}

function arrive(){
  speak('目的地付近です。お疲れさまでした。');
  toast('🏁 目的地に到着しました', 4000);
  stopNav(); clearRoute();
}

function startNav(withSim){
  if(!RT) return;
  navigating = true; follow = true; lastNext = null; incAnnounced = new Set(); lastBetterCheck = Date.now(); drawAlts();
  document.body.classList.add('navi');
  $('#panel').classList.add('hide'); $('#searchBox').classList.add('hide'); $('#results').classList.add('hide');
  ['#guide','#navBar','#speedo'].forEach(s=>$(s).classList.remove('hide'));
  lockScreen();
  speak('ルート案内を開始します。'+(dest.name!=='地図で選んだ地点'?dest.name+'まで、':'')+'およそ'+fmtDur(RT.duration)+'です。');
  if(withSim) startSim();
  else if(pos) onPos(pos.lat,pos.lng,heading,speed,accuracy);
}
function stopNav(){
  navigating = false; stopSim();
  if(hwMode){ hwMode=false; hwVotes=0; document.body.classList.remove('hw'); $('#hwPanel').classList.add('hide'); }
  document.body.classList.remove('navi');
  ['#guide','#navBar','#speedo','#recenter','#roadNow','#sigChip','#jv'].forEach(s=>$(s).classList.add('hide')); jvShown=false; document.body.classList.remove('jvon');
  $('#searchBox').classList.remove('hide');
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  map.easeTo({pitch:0, bearing:0, padding:{top:0,bottom:0,left:0,right:0}, duration:800});
}
$('#btnStart').onclick = ()=>{ startCompass(); startNav(false); };
$('#btnSim').onclick = ()=>{ startCompass(); startNav(true); };
$('#endNav').onclick = ()=>{
  stopNav(); speechSynthesis.cancel();
  if(RT){ drawRoute(); drawAlts(); renderRouteCards(); $('#panel').classList.remove('hide'); }
};

/* ================= テスト走行 ================= */
function startSim(){
  let along = 0; pointAt.i = 0; RT.lastIdx = 0;
  const step = ()=>{
    if(!RT){ stopSim(); return; }
    // 曲がり角の手前は減速
    const nx = RT.steps.find((s,i)=>i>0 && s._at>along+3);
    const toTurn = nx ? nx._at-along : 999;
    const v = toTurn<60 ? 6 : toTurn<200 ? 10 : 15;   // m/秒
    along = Math.min(RT.distance, along + v*0.5*3);  // 3倍速
    const {p,h} = pointAt(along);
    onPos(p.lat, p.lng, h, v, 5);
  };
  sim = setInterval(step, 500); step();
  toast('テスト走行中（3倍速）');
}
function stopSim(){ if(sim){ clearInterval(sim); sim=null; } }

initMap().then(startGeo);
</script>
