<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1720">
<title>しのナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0f1720;--card:#16212d;--line:#2a3a4b;--txt:#eef3f8;--sub:#9fb0c2;--acc:#2f9bff;--go:#1fbf6a;--warn:#ff5a4f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hide{display:none!important}

/* 検索 */
#searchBox{position:fixed;left:10px;right:10px;top:calc(10px + var(--st));z-index:1000}
#searchRow{display:flex;gap:8px;background:var(--card);border-radius:14px;padding:6px;box-shadow:0 4px 16px #0008}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font-size:16px;padding:8px 10px}
#goSearch{background:var(--acc);border-radius:10px;padding:0 16px;font-weight:700}
#results{margin-top:6px;background:var(--card);border-radius:14px;max-height:50vh;overflow:auto;box-shadow:0 4px 16px #0008}
.res{padding:12px 14px;border-bottom:1px solid var(--line)}
.res:last-child{border:0}
.res b{display:block;font-size:15px}
.res small{color:var(--sub);font-size:12px}
.hint{color:var(--sub);font-size:12px;padding:10px 14px}

/* 案内バナー */
#banner{position:fixed;left:10px;right:10px;top:calc(10px + var(--st));z-index:1000;background:#0b5d3b;border-radius:16px;
  padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px #0009}
#bArrow{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center}
#bArrow svg{width:58px;height:58px}
#bDist{font-size:34px;font-weight:800;line-height:1}
#bText{font-size:17px;font-weight:700;margin-top:4px}
#bRoad{font-size:13px;color:#cfe9dc;margin-top:2px}
#then{position:fixed;left:18px;top:calc(104px + var(--st));z-index:999;background:#083b26;border-radius:0 0 12px 12px;padding:6px 12px;font-size:13px;color:#cfe9dc}

/* 下パネル */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-radius:18px 18px 0 0;
  padding:14px 16px calc(14px + var(--sb));box-shadow:0 -4px 20px #0009}
#destName{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sum{display:flex;gap:18px;margin:8px 0 12px;color:var(--sub);font-size:14px}
#sum b{color:var(--txt);font-size:20px}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:16px;background:#243446}
.btn.go{background:var(--go)}
.btn.stop{background:var(--warn)}

#navBar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);padding:12px 16px calc(12px + var(--sb));
  display:flex;align-items:center;gap:14px;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px #0009}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--sub);font-size:12px}
#endNav{background:var(--warn);border-radius:12px;padding:14px 16px;font-weight:700}

/* 右のボタン */
#fab{position:fixed;right:12px;bottom:calc(190px + var(--sb));z-index:1000;display:flex;flex-direction:column;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;background:var(--card);box-shadow:0 3px 12px #0009;font-size:22px;display:flex;align-items:center;justify-content:center}
#recenter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--sb));z-index:1000;background:var(--acc);
  border-radius:24px;padding:10px 18px;font-weight:700;box-shadow:0 3px 12px #0009}
#speedo{position:fixed;left:12px;bottom:calc(100px + var(--sb));z-index:1000;width:64px;height:64px;border-radius:50%;background:#fff;color:#111;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 12px #0009;border:4px solid #2f9bff}
#speedo b{font-size:22px;line-height:1}#speedo small{font-size:10px}

#toast{position:fixed;left:50%;top:calc(80px + var(--st));transform:translateX(-50%);z-index:2000;background:#000c;padding:10px 16px;border-radius:20px;font-size:14px;max-width:90vw;text-align:center}

.car{width:44px;height:44px;transition:transform .3s linear}
.leaflet-container{background:#dfe6ec}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>

<div id="searchBox">
  <div id="searchRow">
    <input id="q" type="search" placeholder="目的地を検索（住所・施設名）" enterkeyhint="search" autocomplete="off">
    <button id="goSearch">検索</button>
  </div>
  <div id="results" class="hide"></div>
</div>

<div id="banner" class="hide">
  <div id="bArrow"></div>
  <div style="min-width:0">
    <div id="bDist"></div>
    <div id="bText"></div>
    <div id="bRoad"></div>
  </div>
</div>
<div id="then" class="hide"></div>

<div id="fab">
  <button class="fab" id="btnVoice" title="音声">🔊</button>
  <button class="fab" id="btnLoc" title="現在地">◎</button>
</div>
<button id="recenter" class="hide">現在地に戻る</button>
<div id="speedo" class="hide"><b id="spd">0</b><small>km/h</small></div>

<div id="panel" class="hide">
  <div id="destName"></div>
  <div id="sum"></div>
  <div class="btns">
    <button class="btn" id="btnCancel">やめる</button>
    <button class="btn" id="btnSim">テスト走行</button>
    <button class="btn go" id="btnStart">案内開始</button>
  </div>
</div>

<div id="navBar" class="hide">
  <div class="stat"><b id="nRemain">-</b><small>残り距離</small></div>
  <div class="stat"><b id="nTime">-</b><small>残り時間</small></div>
  <div class="stat"><b id="nEta">-</b><small>到着予定</small></div>
  <button id="endNav">終了</button>
</div>

<div id="toast" class="hide"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------- 地図 ---------- */
const map = L.map('map', {zoomControl:false}).setView([35.8717, 139.9254], 15); // 流山おおたかの森付近
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  maxNativeZoom:18, maxZoom:19,
  attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a> | ルート: OSRM / © OpenStreetMap'
}).addTo(map);

const carIcon = L.divIcon({className:'', iconSize:[44,44], iconAnchor:[22,22],
  html:'<svg class="car" id="carSvg" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#2f9bff" fill-opacity=".18"/><path d="M22 6 L34 34 L22 28 L10 34 Z" fill="#2f9bff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>'});
const destIcon = L.divIcon({className:'', iconSize:[30,40], iconAnchor:[15,38],
  html:'<svg viewBox="0 0 30 40" width="30" height="40"><path d="M15 1C7 1 1 7 1 15c0 10 14 24 14 24s14-14 14-24C29 7 23 1 15 1z" fill="#ff5a4f" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5" fill="#fff"/></svg>'});

let carMarker = null, destMarker = null, routeCasing = null, routeLine = null;

/* ---------- 状態 ---------- */
let pos = null, heading = 0, speed = 0, accuracy = 20, centered = false;
let dest = null;       // {latlng, name}
let R = null;          // ルート
let navigating = false, follow = true, voiceOn = true;
let spoken = new Set(), offCount = 0, lastReroute = 0, rerouting = false;
let sim = null, wakeLock = null;

/* ---------- 便利関数 ---------- */
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hide'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add('hide'),ms); }
function fmtDist(d){ if(d>=1000) return (d/1000).toFixed(d>=10000?0:1)+' km'; if(d>=100) return Math.round(d/50)*50+' m'; return Math.max(0,Math.round(d/10)*10)+' m'; }
function voiceDist(d){ if(d>=950) return (Math.round(d/100)/10).toString().replace(/\.0$/,'')+'キロ'; return Math.max(100,Math.round(d/100)*100)+'メートル'; }
function fmtDur(s){ const m=Math.round(s/60); if(m<60) return m+'分'; return Math.floor(m/60)+'時間'+(m%60)+'分'; }
function fmtClock(t){ const d=new Date(t); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function bearing(a,b){ const r=Math.PI/180, y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),
  x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);
  return (Math.atan2(y,x)/r+360)%360; }

/* ---------- 音声 ---------- */
let jaVoice = null;
function pickVoice(){ const v=speechSynthesis.getVoices(); jaVoice = v.find(x=>x.lang==='ja-JP' && /Kyoko|O-ren|Google/.test(x.name)) || v.find(x=>x.lang&&x.lang.startsWith('ja')) || null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.05; if(jaVoice) u.voice=jaVoice;
  speechSynthesis.speak(u);
}
$('#btnVoice').onclick = () => { voiceOn=!voiceOn; $('#btnVoice').textContent = voiceOn?'🔊':'🔇'; if(voiceOn) speak('音声案内オン'); else speechSynthesis.cancel(); };

/* ---------- 画面を消さない ---------- */
async function lockScreen(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(navigating && document.visibilityState==='visible') lockScreen(); });

/* ---------- 位置情報 ---------- */
function startGeo(){
  if(!navigator.geolocation){ toast('この端末は位置情報に対応していません'); return; }
  navigator.geolocation.watchPosition(p=>{
    if(sim) return;
    onPos(p.coords.latitude, p.coords.longitude, p.coords.heading, p.coords.speed, p.coords.accuracy);
  }, e=>{ toast('現在地を取得できません（'+e.message+'）'); }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}

function onPos(lat,lng,hd,spd,acc){
  const np = L.latLng(lat,lng);
  if(hd!=null && !isNaN(hd) && (spd==null || spd>1)) heading = hd;
  else if(pos && pos.distanceTo(np)>4) heading = bearing(pos,np);
  pos = np; speed = spd>0 ? spd : 0; accuracy = acc || 20;

  if(!carMarker) carMarker = L.marker(pos,{icon:carIcon, zIndexOffset:1000, interactive:false}).addTo(map);
  else carMarker.setLatLng(pos);
  const svg = document.getElementById('carSvg'); if(svg) svg.style.transform = 'rotate('+heading+'deg)';
  $('#spd').textContent = Math.round(speed*3.6);

  if(!centered){ centered=true; map.setView(pos,16); }
  if(navigating){
    updateNav();
    if(follow){
      const z = speed>22?15 : speed>11?16 : 17;
      if(map.getZoom()!==z) map.setView(pos,z,{animate:true}); else map.panTo(pos,{animate:true,duration:.5});
    }
  }
}

$('#btnLoc').onclick = () => {
  if(!pos){ toast('現在地を取得中です…'); return; }
  follow = true; $('#recenter').classList.add('hide');
  map.setView(pos, Math.max(map.getZoom(),16));
};
$('#recenter').onclick = $('#btnLoc').onclick;
map.on('dragstart', ()=>{ if(navigating){ follow=false; $('#recenter').classList.remove('hide'); } });

/* ---------- 検索 ---------- */
function recent(){ try{ return JSON.parse(localStorage.getItem('navi_recent')||'[]'); }catch(e){ return []; } }
function saveRecent(d){ try{ const list=recent().filter(x=>x.name!==d.name); list.unshift({name:d.name,lat:d.latlng.lat,lng:d.latlng.lng}); localStorage.setItem('navi_recent',JSON.stringify(list.slice(0,8))); }catch(e){} }

function showResults(items, title){
  const box = $('#results'); box.innerHTML='';
  if(title){ const h=document.createElement('div'); h.className='hint'; h.textContent=title; box.appendChild(h); }
  if(!items.length){ const h=document.createElement('div'); h.className='hint'; h.textContent='見つかりませんでした。別の言葉か住所で試してください。'; box.appendChild(h); }
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='res';
    const b=document.createElement('b'); b.textContent=it.name; d.appendChild(b);
    const s=document.createElement('small'); s.textContent=(it.sub||'')+(pos?'　約'+fmtDist(pos.distanceTo([it.lat,it.lng])):''); d.appendChild(s);
    d.onclick=()=>{ box.classList.add('hide'); $('#q').blur(); setDest(L.latLng(it.lat,it.lng), it.name); };
    box.appendChild(d);
  });
  box.classList.remove('hide');
}

async function search(){
  const q = $('#q').value.trim(); if(!q) return;
  $('#q').blur(); showResults([], '検索中…'); $('#results .hint:last-child').remove();
  const near = pos || map.getCenter();
  const nomi = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=jp&accept-language=ja'
    + `&viewbox=${near.lng-0.6},${near.lat+0.6},${near.lng+0.6},${near.lat-0.6}&q=` + encodeURIComponent(q);
  const gsi = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q);
  const [a,b] = await Promise.allSettled([fetch(nomi).then(r=>r.json()), fetch(gsi).then(r=>r.json())]);
  let items = [];
  if(a.status==='fulfilled') a.value.forEach(x=>{
    const parts = (x.display_name||'').split(',').map(s=>s.trim());
    items.push({name:x.name||parts[0], sub:parts.slice(1).reverse().filter(s=>!/^\d{3}-\d{4}$/.test(s)&&s!=='日本').join(' '), lat:+x.lat, lng:+x.lon});
  });
  if(b.status==='fulfilled') b.value.slice(0,8).forEach(x=>{
    items.push({name:x.properties.title, sub:'住所', lat:x.geometry.coordinates[1], lng:x.geometry.coordinates[0]});
  });
  // 近い順に並べる
  items.sort((p,q2)=>near.distanceTo([p.lat,p.lng]) - near.distanceTo([q2.lat,q2.lng]));
  showResults(items.slice(0,12), a.status!=='fulfilled' && b.status!=='fulfilled' ? '通信エラーです。電波を確認してください。' : '');
}
$('#goSearch').onclick = search;
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });
$('#q').addEventListener('focus', ()=>{
  if($('#q').value.trim()) return;
  const r = recent();
  if(r.length) showResults(r.map(x=>({name:x.name, sub:'最近の目的地', lat:x.lat, lng:x.lng})), '最近の目的地（地図を長押しでも目的地を指定できます）');
  else { $('#results').innerHTML='<div class="hint">地図を長押しすると、その場所を目的地にできます。</div>'; $('#results').classList.remove('hide'); }
});
map.on('click', ()=>$('#results').classList.add('hide'));
map.on('contextmenu', e=>{ if(navigating) return; setDest(e.latlng, '地図で選んだ地点'); });

/* ---------- 目的地とルート ---------- */
async function setDest(latlng, name){
  dest = {latlng, name};
  if(destMarker) destMarker.setLatLng(latlng); else destMarker = L.marker(latlng,{icon:destIcon}).addTo(map);
  saveRecent(dest);
  $('#destName').textContent = '📍 '+name;
  $('#sum').innerHTML = 'ルートを検索中…';
  $('#panel').classList.remove('hide');
  let from = pos;
  if(!from){ from = map.getCenter(); toast('現在地が取れないため、地図の中心を出発地にしました'); }
  try{
    await calcRoute(from, latlng);
    map.fitBounds(routeLine.getBounds(), {paddingTopLeft:[30,90], paddingBottomRight:[30,200]});
    $('#sum').innerHTML = `<span><b>${fmtDist(R.distance)}</b></span><span><b>${fmtDur(R.duration)}</b></span><span>到着 <b>${fmtClock(Date.now()+R.duration*1000)}</b></span>`;
  }catch(e){
    $('#sum').textContent = 'ルートが見つかりませんでした（'+e.message+'）';
  }
}

async function calcRoute(from, to){
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson&steps=true`;
  const res = await fetch(url);
  const j = await res.json();
  if(j.code!=='Ok' || !j.routes.length) throw new Error(j.message||j.code||'エラー');
  const rt = j.routes[0];
  const coords = rt.geometry.coordinates.map(c=>L.latLng(c[1],c[0]));
  const cum=[0]; for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+coords[i-1].distanceTo(coords[i]));
  const steps = rt.legs[0].steps;
  let j0 = 0;
  steps.forEach(s=>{
    const ml = L.latLng(s.maneuver.location[1], s.maneuver.location[0]);
    let bi=j0, bd=Infinity;
    for(let i=j0;i<coords.length;i++){ const d=coords[i].distanceTo(ml); if(d<bd){bd=d;bi=i;} if(bd<0.5) break; }
    j0 = bi; s._at = cum[bi];
  });
  R = {coords, cum, steps, distance:cum[cum.length-1], duration:rt.duration, lastIdx:0};
  spoken = new Set();
  if(routeCasing){ routeCasing.remove(); routeLine.remove(); }
  routeCasing = L.polyline(coords,{color:'#0b4f8a',weight:11,opacity:.9}).addTo(map);
  routeLine   = L.polyline(coords,{color:'#3fa9ff',weight:7,opacity:1}).addTo(map);
}

function clearRoute(){
  if(routeCasing){ routeCasing.remove(); routeLine.remove(); routeCasing=routeLine=null; }
  if(destMarker){ destMarker.remove(); destMarker=null; }
  R=null; dest=null; $('#panel').classList.add('hide');
}
$('#btnCancel').onclick = clearRoute;

/* ---------- 案内文 ---------- */
const DIR = {'left':'左','right':'右','slight left':'斜め左','slight right':'斜め右','sharp left':'左に大きく','sharp right':'右に大きく','straight':'直進','uturn':'Uターン'};
const ANG = {'straight':0,'slight right':45,'right':90,'sharp right':135,'uturn':180,'slight left':-45,'left':-90,'sharp left':-135};
function instr(s){
  const t=s.maneuver.type, m=s.maneuver.modifier||'straight', d=DIR[m]||'';
  const side = m.includes('left')?'左側の':m.includes('right')?'右側の':'';
  switch(t){
    case 'arrive': return '目的地です';
    case 'depart': return '出発します';
    case 'turn': case 'end of road':
      if(m==='left') return (t==='end of road'?'突き当たりを':'')+'左折です';
      if(m==='right') return (t==='end of road'?'突き当たりを':'')+'右折です';
      if(m==='uturn') return 'Uターンです';
      if(m==='straight') return '直進です';
      return d+'方向です';
    case 'merge': return '合流します';
    case 'on ramp': return side+'入口に入ります';
    case 'off ramp': return side+'出口に進みます';
    case 'fork': return '分岐を'+(m.includes('left')?'左':m.includes('right')?'右':'直進')+'方向です';
    case 'roundabout': case 'rotary': return 'ロータリーを'+(s.maneuver.exit||'')+'番目の出口です';
    case 'new name': case 'continue': case 'notification':
      return m==='straight' ? '道なりに進みます' : d+'方向です';
    default: return d ? d+'方向です' : '道なりに進みます';
  }
}
function arrowSvg(s){
  if(s.maneuver.type==='arrive') return '<svg viewBox="0 0 60 60"><path d="M16 54V8" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M18 8h28l-7 9 7 9H18z" fill="#fff"/></svg>';
  const m = s.maneuver.modifier||'straight';
  if(m==='uturn') return '<svg viewBox="0 0 60 60"><path d="M40 54V24a12 12 0 0 0-24 0v8" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M6 30l10 14 10-14z" fill="#fff"/></svg>';
  const a = ANG[m]||0;
  return `<svg viewBox="0 0 60 60" style="transform:rotate(${a}deg)"><path d="M30 6 L48 28 H36 V54 H24 V28 H12 Z" fill="#fff"/></svg>`;
}

/* ---------- ルート上の位置 ---------- */
function projectOnRoute(p){
  const C=R.coords, n=C.length;
  const kx=Math.cos(p.lat*Math.PI/180)*111320, ky=110540;
  const scan=(a,b)=>{ let best={d:1e9,i:0,t:0};
    for(let i=a;i<b;i++){
      const ax=(C[i].lng-p.lng)*kx, ay=(C[i].lat-p.lat)*ky, bx=(C[i+1].lng-p.lng)*kx, by=(C[i+1].lat-p.lat)*ky;
      const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
      let t = L2 ? -(ax*dx+ay*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(ax+t*dx, ay+t*dy);
      if(d<best.d) best={d,i,t};
    } return best; };
  let b = scan(Math.max(0,R.lastIdx-3), Math.min(n-1,R.lastIdx+400));
  if(b.d>60){ const f=scan(0,n-1); if(f.d<b.d) b=f; }
  R.lastIdx = b.i;
  b.along = R.cum[b.i] + b.t*(R.cum[b.i+1]-R.cum[b.i]);
  return b;
}
function pointAt(a){
  const C=R.coords, cum=R.cum; let i=Math.max(0,(pointAt.i||0)-1);
  if(cum[i]>a) i=0;
  while(i<cum.length-2 && cum[i+1]<a) i++;
  pointAt.i=i;
  const seg=cum[i+1]-cum[i]||1, t=Math.min(1,Math.max(0,(a-cum[i])/seg));
  return {p:L.latLng(C[i].lat+(C[i+1].lat-C[i].lat)*t, C[i].lng+(C[i+1].lng-C[i].lng)*t), h:bearing(C[i],C[i+1])};
}

/* ---------- 案内 ---------- */
function updateNav(){
  if(!R || rerouting) return;
  const pr = projectOnRoute(pos);

  // ルートから外れたら再検索
  if(!sim && pr.d > Math.max(50, accuracy*1.5)){
    offCount++;
    if(offCount>=3 && Date.now()-lastReroute>10000){ reroute(); return; }
  } else offCount = 0;

  const remain = R.distance - pr.along;
  if(remain < 25){ arrive(); return; }

  let k = R.steps.findIndex((s,i)=>i>0 && s._at > pr.along+3);
  if(k<0) k = R.steps.length-1;
  const s = R.steps[k], dnext = Math.max(0, s._at - pr.along);

  $('#bArrow').innerHTML = arrowSvg(s);
  $('#bDist').textContent = fmtDist(dnext);
  $('#bText').textContent = instr(s);
  const road = [s.name, s.ref].filter(Boolean).join(' ');
  $('#bRoad').textContent = s.maneuver.type==='arrive' ? dest.name : (road ? road+' へ' : '');

  // その先の案内（近い時だけ）
  const s2 = R.steps[k+1];
  if(s2 && s2._at - s._at < 250 && dnext < 300){ $('#then').textContent = 'その先 '+instr(s2); $('#then').classList.remove('hide'); }
  else $('#then').classList.add('hide');

  // 音声
  const text = instr(s);
  if(dnext<=1200 && dnext>800 && speed>16 && !spoken.has(k+'a')){ spoken.add(k+'a'); speak(voiceDist(dnext)+'先、'+text); }
  else if(dnext<=550 && dnext>200 && !spoken.has(k+'b')){ spoken.add(k+'b'); speak('およそ'+voiceDist(dnext)+'先、'+text); }
  else if(dnext<=Math.max(60, speed*6) && !spoken.has(k+'c')){ spoken.add(k+'c'); spoken.add(k+'b'); speak(s.maneuver.type==='arrive'?'まもなく目的地です':'まもなく、'+text); }

  // 残り
  const rs = R.duration * (remain/R.distance);
  $('#nRemain').textContent = fmtDist(remain);
  $('#nTime').textContent = fmtDur(rs);
  $('#nEta').textContent = fmtClock(Date.now()+rs*1000);
}

async function reroute(){
  rerouting = true; lastReroute = Date.now(); offCount = 0;
  speak('ルートを再検索します');
  $('#bText').textContent = 'ルート再検索中…';
  try{ await calcRoute(pos, dest.latlng); }
  catch(e){ toast('再検索に失敗しました'); }
  rerouting = false;
  updateNav();
}

function arrive(){
  speak('目的地に到着しました。お疲れさまでした。');
  toast('🏁 目的地に到着しました', 4000);
  stopNav(); clearRoute();
}

function startNav(withSim){
  if(!R) return;
  // iOSは操作時に一度しゃべらせないと音声が出ないため、ここで鳴らす
  navigating = true; follow = true;
  $('#panel').classList.add('hide'); $('#searchBox').classList.add('hide'); $('#results').classList.add('hide');
  $('#banner').classList.remove('hide'); $('#navBar').classList.remove('hide'); $('#speedo').classList.remove('hide');
  $('#fab').style.bottom = 'calc(100px + var(--sb))'; $('#speedo').style.bottom = 'calc(100px + var(--sb))';
  lockScreen();
  speak('ルート案内を開始します。'+(dest.name!=='地図で選んだ地点'?dest.name+'まで、':'')+'およそ'+fmtDur(R.duration)+'です。');
  if(withSim) startSim();
  if(pos) onPos(pos.lat,pos.lng,heading,speed,accuracy);
}
function stopNav(){
  navigating = false; stopSim();
  $('#banner').classList.add('hide'); $('#then').classList.add('hide'); $('#navBar').classList.add('hide');
  $('#speedo').classList.add('hide'); $('#recenter').classList.add('hide'); $('#searchBox').classList.remove('hide');
  $('#fab').style.bottom = '';
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
}
$('#btnStart').onclick = ()=>startNav(false);
$('#btnSim').onclick = ()=>startNav(true);
$('#endNav').onclick = ()=>{ stopNav(); if(dest){ $('#panel').classList.remove('hide'); } speechSynthesis.cancel(); };

/* ---------- テスト走行（シミュレーション） ---------- */
function startSim(){
  let along = 0; pointAt.i = 0; R.lastIdx = 0;
  const step = ()=>{
    if(!R){ stopSim(); return; }
    const v = along<200 ? 10 : 15;          // 約36〜54km/h
    along += v * 0.5 * 3;                   // 3倍速
    if(along >= R.distance){ along = R.distance; }
    const {p,h} = pointAt(along);
    onPos(p.lat, p.lng, h, v, 5);
  };
  sim = setInterval(step, 500); step();
  toast('テスト走行中（3倍速）');
}
function stopSim(){ if(sim){ clearInterval(sim); sim=null; } }

startGeo();
</script>
